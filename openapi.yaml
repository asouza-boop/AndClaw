openapi: 3.1.0
info:
  title: AndClaw API
  description: Personal AI Agent — Command Center backend API
  version: 2.0.0
  contact:
    name: AndClaw
servers:
  - url: https://andclaw.onrender.com
    description: Production (Render)
  - url: http://localhost:3000
    description: Local Development

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Capture:
      type: object
      properties:
        id:         { type: integer }
        content:    { type: string }
        source:     { type: string, default: pwa }
        type:       { type: string, enum: [note, task, idea, link] }
        status:     { type: string, enum: [new, processed, archived] }
        tags:       { type: array, items: { type: string } }
        project_id: { type: [integer, "null"] }
        due_date:   { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    Task:
      type: object
      properties:
        id:         { type: integer }
        title:      { type: string }
        status:     { type: string, enum: [open, in_progress, done] }
        priority:   { type: string, enum: [low, normal, high] }
        due_date:   { type: [string, "null"], format: date-time }
        project_id: { type: [integer, "null"] }
        created_at: { type: string, format: date-time }

    Agent:
      type: object
      properties:
        id:          { type: integer }
        name:        { type: string }
        level:       { type: string, enum: [Estrategico, Tatico, Operacional] }
        status:      { type: string }
        description: { type: [string, "null"] }
        areas:       { type: array, items: { type: string } }
        skills:      { type: array, items: { type: string } }
        tags:        { type: array, items: { type: object } }
        created_at:  { type: string, format: date-time }

    Skill:
      type: object
      properties:
        slug:        { type: string }
        title:       { type: string }
        description: { type: string }
        tools:       { type: array, items: { type: string } }
        sections:    { type: integer }

    Meeting:
      type: object
      properties:
        id:               { type: integer }
        title:            { type: string }
        meeting_date:     { type: [string, "null"], format: date-time }
        transcript_text:  { type: [string, "null"] }
        created_at:       { type: string, format: date-time }

    Favorite:
      type: object
      properties:
        id:         { type: integer }
        title:      { type: string }
        url:        { type: string, format: uri }
        source:     { type: string }
        external_id: { type: [string, "null"] }
        created_at: { type: string, format: date-time }

    Tag:
      type: object
      properties:
        id:    { type: integer }
        name:  { type: string }
        color: { type: string }

    Error:
      type: object
      properties:
        error:   { type: string }
        message: { type: string }

    OkResponse:
      type: object
      properties:
        ok: { type: boolean, example: true }

paths:

  # ── HEALTH ──────────────────────────────────────────────────
  /api/health:
    get:
      tags: [Health]
      summary: Liveness check
      security: []
      responses:
        '200':
          description: API online
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }

  /api/health/db:
    get:
      tags: [Health]
      summary: Database connectivity check
      security: []
      responses:
        '200':
          description: Database connected
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:         { type: boolean }
                  latency_ms: { type: integer }
                  database:   { type: string }

  /api/status:
    get:
      tags: [Health]
      summary: Full system status
      responses:
        '200':
          description: System status overview
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:           { type: boolean }
                  db:           { type: object }
                  google:       { type: object }
                  gitvault:     { type: boolean }
                  push:         { type: boolean }
                  raindrop:     { type: boolean }
                  llmConfigured: { type: boolean }
                  llm:          { type: object }
                  pushSubscriptions: { type: integer }
                  deploy:       { type: object }

  # ── AUTH ────────────────────────────────────────────────────
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login and get JWT token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, minLength: 8 }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
        '401':
          description: Invalid password

  /api/auth/bootstrap:
    post:
      tags: [Auth]
      summary: First-time system setup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:    { type: string, minLength: 8 }
                tokenSecret: { type: string, minLength: 24 }
      responses:
        '200':
          description: Bootstrap successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:       { type: string }
                  tokenSecret: { type: string }
        '409':
          description: Already bootstrapped

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Verify token and get current user
      responses:
        '200':
          description: Current user payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  id: { type: string }
                  email: { type: [string, 'null'] }
                  fullName: { type: [string, 'null'] }
                  name: { type: [string, 'null'] }
                  company: { type: [string, 'null'] }
                  role: { type: [string, 'null'] }
                  photoUrl: { type: [string, 'null'] }
                  profile:
                    type: object
                    additionalProperties: { type: string }
        '401':
          description: Unauthorized

  /api/projects:
    get:
      tags: [Projects]
      summary: List all projects
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of projects
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  items: { type: array, items: { type: object } }

    post:
      tags: [Projects]
      summary: Create a project
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                status: { type: string, default: active }
                summary: { type: string }
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  id: { type: integer }
                  item:
                    type: object
                    additionalProperties: true

  /api/daily-briefing:
    get:
      tags: [Daily Briefing]
      summary: Get daily briefing summary
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: query
          schema: { type: string, default: pwa-user }
      responses:
        '200':
          description: Briefing data
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  briefing: { type: object }

  /api/daily-briefing/generate:
    post:
      tags: [Daily Briefing]
      summary: Force generate daily briefing
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                userId: { type: string, default: pwa-user }
      responses:
        '200':
          description: New briefing generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  briefing: { type: object }

  /api/messages:
    get:
      tags: [Messages]
      summary: List messages
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, maximum: 200, default: 50 }
      responses:
        '200':
          description: List of messages
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  items: { type: array, items: { type: object } }

    post:
      tags: [Messages]
      summary: Create a message
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
                conversationId: { type: string, default: default }
                client_message_id: { type: string }
                sender: { type: string }
                role: { type: string }
      responses:
        '201':
          description: Message created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  id: { type: integer }
                  item:
                    type: object
                    additionalProperties: true
                  message:
                    type: object
                    additionalProperties: true

  /api/messages/conversation/{id}:
    get:
      tags: [Messages]
      operationId: getMessagesByConversation
      summary: List messages by conversation
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, maximum: 500, default: 200 }
      responses:
        '200':
          description: List of messages
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  items: { type: array, items: { type: object } }

  /api/messages/{id}/trace:
    get:
      tags: [Messages]
      summary: Get message execution trace
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Execution trace
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  trace: { type: object }

  /api/conversations/{id}/latest-trace:
    get:
      tags: [Messages]
      summary: Get latest conversation trace
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Latest trace
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  trace: { type: object }

  /api/memory:
    get:
      tags: [Memory]
      summary: List memory items
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of memory items
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  items: { type: array, items: { type: object } }

    post:
      tags: [Memory]
      summary: Create a memory item
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, content]
              properties:
                type: { type: string }
                content: { type: string }
                source_type: { type: string }
                source_id: { type: string }
      responses:
        '201':
          description: Memory item created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  id: { type: integer }
                  item:
                    type: object
                    additionalProperties: true

  /api/knowledge:
    get:
      tags: [Memory]
      summary: List knowledge items
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of knowledge items
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  items: { type: array, items: { type: object } }

    post:
      tags: [Memory]
      summary: Create a knowledge item
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string }
                title: { type: string, description: "Alias for content" }
                content: { type: string, description: "Main text content" }
                source_type: { type: string }
                source_id: { type: string }
      responses:
        '201':
          description: Knowledge item created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  id: { type: integer }
                  item:
                    type: object
                    additionalProperties: true

  /api/knowledge/{id}:
    patch:
      tags: [Memory]
      summary: Update a knowledge item
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                content: { type: string }
                title: { type: string }
                type: { type: string }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  item: { type: object }

    delete:
      tags: [Memory]
      summary: Delete a knowledge item
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }

  /api/llm/providers:
    get:
      tags: [LLM]
      summary: List all providers
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of providers
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  items: { type: array, items: { type: object } }

    post:
      tags: [LLM]
      summary: Create a provider
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, api_key]
              properties:
                id: { type: string }
                name: { type: string }
                api_key: { type: string, writeOnly: true }
                base_url: { type: string }
                model: { type: string }
                priority: { type: integer, default: 0 }
      responses:
        '201':
          description: Provider created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  id: { type: string }
                  item:
                    type: object
                    additionalProperties: true

  /api/llm/providers/{id}:
    patch:
      tags: [LLM]
      summary: Update a provider
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                priority: { type: integer }
                api_key: { type: string }
                model: { type: string }
                base_url: { type: string }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  item: { type: object }

    delete:
      tags: [LLM]
      summary: Delete a provider
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }

  /api/llm/providers/test:
    post:
      tags: [LLM]
      summary: Test provider connection
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '200':
          description: Test successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  message: { type: string }

  # ── CAPTURES (INBOX) ────────────────────────────────────────
  /api/captures:
    get:
      tags: [Captures]
      summary: List inbox captures
      parameters:
        - name: type
          in: query
          schema: { type: string, enum: [note, task, idea, link] }
        - name: status
          in: query
          schema: { type: string, enum: [new, processed, archived] }
      responses:
        '200':
          description: List of captures
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:    { type: boolean }
                  items: { type: array, items: { $ref: '#/components/schemas/Capture' } }

    post:
      tags: [Captures]
      summary: Create a new capture
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:    { type: string, description: "Main text (also accepts 'title' as alias)" }
                title:      { type: string, description: "Alias for content" }
                source:     { type: string, default: pwa }
                type:       { type: string, enum: [note, task, idea, link], default: note }
                status:     { type: string, enum: [new, processed, archived], default: new }
                tags:       { type: array, items: { type: string } }
                project_id: { type: integer }
                due_date:   { type: string, format: date-time }
      responses:
        '201':
          description: Capture created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:      { type: boolean }
                  id:      { type: integer }
                  title:   { type: string }
                  content: { type: string }
                  type:    { type: string }
                  status:  { type: string }
                  item:    { $ref: '#/components/schemas/Capture' }

  /api/captures/{id}:
    patch:
      tags: [Captures]
      summary: Update capture status or type
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:  { type: string, enum: [new, processed, archived] }
                type:    { type: string, enum: [note, task, idea, link] }
                content: { type: string }
      responses:
        '200':
          description: Updated

    delete:
      tags: [Captures]
      summary: Delete a capture
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Deleted

  /api/captures/bulk:
    post:
      tags: [Captures]
      summary: Bulk action on captures
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, action]
              properties:
                ids:    { type: array, items: { type: integer } }
                action: { type: string, enum: [delete, archive, convert_task, set_type] }
                type:   { type: string, description: "Required when action=set_type" }
      responses:
        '200':
          description: Action applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }

  # ── TASKS ───────────────────────────────────────────────────
  /api/tasks:
    get:
      tags: [Tasks]
      summary: List tasks
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [open, in_progress, done] }
        - name: priority
          in: query
          schema: { type: string, enum: [low, normal, high] }
      responses:
        '200':
          description: List of tasks
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:    { type: boolean }
                  items: { type: array, items: { $ref: '#/components/schemas/Task' } }

    post:
      tags: [Tasks]
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:      { type: string }
                status:     { type: string, enum: [open, in_progress, done], default: open }
                priority:   { type: string, enum: [low, normal, high], default: normal }
                due_date:   { type: string, format: date-time }
                project_id: { type: integer }
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:   { type: boolean }
                  id:   { type: integer }
                  item: { $ref: '#/components/schemas/Task' }

  /api/tasks/{id}:
    patch:
      tags: [Tasks]
      summary: Update a task
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:    { type: string }
                status:   { type: string, enum: [open, in_progress, done] }
                priority: { type: string, enum: [low, normal, high] }
                due_date: { type: string, format: date-time }
      responses:
        '200':
          description: Updated

    delete:
      tags: [Tasks]
      summary: Delete a task
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Deleted

  # ── AGENTS ──────────────────────────────────────────────────
  /api/agents:
    get:
      tags: [Agents]
      summary: List all agents
      responses:
        '200':
          description: Enveloped list of agents
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Agent' }

    post:
      tags: [Agents]
      summary: Create an agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:        { type: string }
                level:       { type: string, enum: [Estrategico, Tatico, Operacional] }
                status:      { type: string, default: ativo }
                description: { type: string }
                areas:       { type: array, items: { type: string } }
                skills:      { type: array, items: { type: string } }
                tags:        { type: array, items: { type: string } }
                base_doc:    { type: string }
      responses:
        '201':
          description: Agent created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:     { type: boolean }
                  id:     { type: integer }
                  name:   { type: string }
                  level:  { type: string }
                  status: { type: string }
                  item:   { $ref: '#/components/schemas/Agent' }

  /api/agents/{id}:
    patch:
      tags: [Agents]
      summary: Update an agent
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:        { type: string }
                level:       { type: string }
                status:      { type: string }
                description: { type: string }
      responses:
        '200':
          description: Updated

    delete:
      tags: [Agents]
      summary: Delete an agent
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Deleted

  # ── SKILLS ──────────────────────────────────────────────────
  /api/skills:
    get:
      tags: [Skills]
      summary: List skills loaded from disk
      responses:
        '200':
          description: List of skills
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:     { type: boolean }
                  items:  { type: array, items: { $ref: '#/components/schemas/Skill' } }
